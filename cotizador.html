<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═══════════════ Datos base ═══════════════ */
const OPTS = {
  partitionDepth:[54,57,60,63,66,69,72,78],
  stallWidth:[36,42,48,54,60,66,70],
  doorOpening:[24,26,28,30,32,34,36],
  swing:[['left-in','Izq · adentro'],['left-out','Izq · afuera'],['right-in','Der · adentro'],['right-out','Der · afuera']],
  position:[['center','Centro'],['left','Izquierda'],['right','Derecha']],
  frac:[['0','--'],['0.25','1/4"'],['0.5','1/2"'],['0.75','3/4"']],
  screenDepth:[16,18,20,22,24,26,30],
  urinalWidth:[24,28,30,32,36,42],
  height:[36,42,48,55,58,64,72,84,96],
  floorGap:[0,4,6,8,10,12,14,16]
};

const MATERIALS = [
  {id:'laminado', name:'Laminado plástico', lvl:1, warranty:'1 año',  perStall:320, tag:'Económico',        desc:'Uso ligero en interiores secos.', colors:['#e7e2d6','#c9d3d6','#b8c4b0','#d8c3a5']},
  {id:'metal',    name:'Acero laminado',    lvl:2, warranty:'5 años',  perStall:390, tag:'Clásico',          desc:'Resistente y buen precio.',        colors:['#9aa6ad','#6f7d86','#8a8f74','#b6a48c']},
  {id:'hdpe',     name:'Polietileno HDPE',  lvl:3, warranty:'25 años', perStall:520, tag:'Anti-humedad',     desc:'Ideal para humedad y vandalismo.', colors:['#5a7d94','#3f6f5f','#7a5c46','#4b4f57','#8a5b6a']},
  {id:'compacto', name:'Fenólico compacto', lvl:4, warranty:'15 años', perStall:610, tag:'Alta resistencia', desc:'Máxima resistencia estructural.',  colors:['#2f3a42','#4a3b2f','#3a4b3f','#5a5150']},
  {id:'inox',     name:'Acero inoxidable',  lvl:5, warranty:'15 años', perStall:840, tag:'Premium',          desc:'Acabado premium, larga vida.',     colors:['#b8bfc4','#9099a0','#c7ccd0']}
];

const LAYOUTS = [
  {id:'inline',   name:'En línea',        desc:'Todas las cabinas contra una pared. Simple y económico; ideal para espacios alargados.'},
  {id:'alcove',   name:'Entre muros',     desc:'En un nicho, con pared a ambos lados. Aprovecha un hueco existente.'},
  {id:'corner-l', name:'En esquina (L)',  desc:'Sobre dos paredes en ángulo. Ideal para espacios cuadrados o esquinas.'},
  {id:'island',   name:'Espalda con espalda', desc:'Dos hileras que comparten muro. Máxima densidad en salas anchas.'}
];

/* Tamaños con nombre. El cliente elige "Amplia", no 70 pulgadas; las medidas
   crudas siguen ahí, pero plegadas en "Ajuste fino". */
const SIZE_PRESETS = {
  stall:[
    {id:'compacta', name:'Compacta', dim:'48"', desc:'Aprovecha el espacio',
     cfg:{stallWidth:48, stallWidthFrac:0, partitionDepth:60, doorOpening:26}},
    {id:'estandar', name:'Estándar', dim:'60"', desc:'La más común',
     cfg:{stallWidth:60, stallWidthFrac:0, partitionDepth:72, doorOpening:32}},
    {id:'amplia',   name:'Amplia',   dim:'70"', desc:'Más holgura',
     cfg:{stallWidth:70, stallWidthFrac:0, partitionDepth:78, doorOpening:36}}
  ],
  urinal:[
    {id:'compacta', name:'Compacta', dim:'24"', desc:'Máxima densidad',
     cfg:{stallWidth:24, partitionDepth:18}},
    {id:'estandar', name:'Estándar', dim:'30"', desc:'La más común',
     cfg:{stallWidth:30, partitionDepth:24}},
    {id:'amplia',   name:'Amplia',   dim:'36"', desc:'Más separación',
     cfg:{stallWidth:36, partitionDepth:26}}
  ]
};

const STEPS = [
  {t:'Tu espacio',    m:'Selección'},
  {t:'Distribución',  m:'Diseño'},
  {t:'Medidas',       m:'Ajuste fino'},
  {t:'Material', m:'Acabado'},
  {t:'Cotización',    m:'Cierre'}
];

/* Una unidad = una posición de uso. `kind` dice qué es (inodoro o mingitorio) y
   `run` en qué hilera vive. Antes ambas cosas vivían en la sala: el tipo era un
   interruptor global excluyente y el reparto entre hileras era un ceil(n/2) fijo.
   Al bajarlas a la unidad, una misma cotización admite tipos mezclados y
   repartos libres (2 de un lado, 8 del otro). */
function defaultStall(kind, run){
  const base={kind, run:run||0, stallWidthFrac:0, doorSwing:'left-in',
              doorPosition:'center', toiletPosition:'center', ada:false, privacy:false};
  return kind==='urinal'
    ? {...base, partitionDepth:24, stallWidth:30, doorOpening:0}
    : {...base, partitionDepth:72, stallWidth:70, doorOpening:34};
}

const state = {
  step:0, view:'2d', selected:0, sel:[0],   // `selected` es el ancla; `sel` la selección múltiple
  materialId:'hdpe', colorHex:'#5a7d94',
  zip:'',
  room:{ name:'Baño 1', back:'concrete', showWall:true, height:58, floorGap:12, mount:'standard',
         stalls:Array.from({length:5},()=>defaultStall('stall')),
         splitAuto:true, ada:false, layout:'inline',
         /* Riel superior: 'none' | 'flush' (al ras, corona las pilastras)
            | 'total' (corrido al frente). Antes se dibujaba siempre, aunque
            nadie lo pidiera, y quedaba flotando sin sujetar nada. */
         headrail:'none' }
};
const isUrinalUnit = u => u.kind==='urinal';
function countKind(k){ return state.room.stalls.filter(u=>u.kind===k).length; }

/* ── Selección múltiple ───────────────────────────────────────
   `state.selected` es el ancla (la que se edita y de la que salen las cotas);
   `state.sel` son todas las unidades a las que se aplica un cambio. Editar de
   una en una era el cuello de botella real al configurar diez cabinas. */
const selHas = i => state.sel.includes(i);
function setSel(list, anchor){
  const n=state.room.stalls.length;
  const uniq=[...new Set(list)].filter(i=>i>=0&&i<n).sort((a,b)=>a-b);
  state.sel = uniq.length ? uniq : [Math.max(0,Math.min(n-1,anchor|0))];
  state.selected = state.sel.includes(anchor) ? anchor : state.sel[0];
}
/* Conjuntos con nombre: de aquí salen los botones de "aplicar a". */
function scopeIndices(scope){
  const list=state.room.stalls, a=state.selected, all=list.map((_,i)=>i);
  if(scope==='all')  return all;
  if(scope==='kind') return all.filter(i=>list[i].kind===list[a].kind);
  if(scope==='run')  return all.filter(i=>unitRun(i)===unitRun(a));
  return [a];
}
function activeScope(){
  const cur=[...state.sel].sort((x,y)=>x-y).join(',');
  // 'all' antes que 'run': con una sola hilera ambos coinciden y gana el más claro.
  return ['one','kind','all','run'].find(s=>scopeIndices(s).sort((x,y)=>x-y).join(',')===cur) || null;
}
/* Un cambio solo se aplica a lo seleccionado del mismo tipo que el ancla: las
   pulgadas de una cabina no significan lo mismo en un mingitorio. */
function editTargets(){
  const list=state.room.stalls, k=list[state.selected] && list[state.selected].kind;
  return state.sel.filter(i=>list[i] && list[i].kind===k);
}

const PL = 3;                          // grosor de pilastra (pulgadas)
const S = 1/12;                        // pulgadas -> pies (3D)
const feetInches = i => { const f=Math.floor(i/12), n=Math.round(i-f*12); return `${f}'-${n}"`; };
const money = n => '$'+Math.round(n).toLocaleString('en-US');

/* ═══════════════ Motor de distribución (runs axis-aligned) ═══════════════ */
function makeFixtures(){
  return state.room.stalls.map((c,i)=>({gi:i, run:c.run|0, width:c.stallWidth+c.stallWidthFrac, depth:c.partitionDepth, cfg:c}));
}
function buildRun(orient, facing, x, y, fx, sideWalls, emptyDepth){
  let a = PL; const stalls=[];
  fx.forEach(f=>{ stalls.push({...f, aStart:a, aEnd:a+f.width, aCenter:a+f.width/2}); a += f.width + PL; });
  // Una hilera vacía conserva huella: se dibuja punteada y sirve de zona de soltado.
  const empty=!fx.length;
  const length = empty ? 2*(PL+36) : a;
  const depth  = empty ? (emptyDepth||60) : Math.max(1,...fx.map(f=>f.depth));
  const r={orient, facing, x, y, length, depth, stalls, empty, sideWalls:sideWalls||[false,false]};
  // datos para 3D
  if(orient==='h' && facing==='down'){ r.theta=0;           r.o3={x:x,          y:y}; }
  if(orient==='h' && facing==='up'){   r.theta=Math.PI;     r.o3={x:x+length,   y:y+depth}; }
  if(orient==='v' && facing==='right'){r.theta=Math.PI/2;   r.o3={x:x,          y:y+length}; }
  return r;
}
function runCount(L){ return (L==='island'||L==='corner-l') ? 2 : 1; }
/* Reparto entre hileras. Mientras nadie lo toque (`splitAuto`) se usa el 50/50
   de siempre; en cuanto el usuario mueve una unidad, manda el `run` de cada una. */
function splitFixtures(fx, nRuns, auto){
  if(nRuns===1) return [fx];
  if(auto){ const k=Math.ceil(fx.length/2); return [fx.slice(0,k), fx.slice(k)]; }
  return [fx.filter(f=>f.run!==1), fx.filter(f=>f.run===1)];
}
function computeRuns(layoutOverride){
  const fx=makeFixtures();
  const L=layoutOverride||state.room.layout;
  const auto = layoutOverride ? true : !!state.room.splitAuto;
  const G=splitFixtures(fx, runCount(L), auto);
  const depthOf=g=>g&&g.length?Math.max(...g.map(f=>f.depth)):0;
  const dA=depthOf(G[0]), dB=depthOf(G[1]), fb=Math.max(dA,dB,60);
  let runs=[];
  if(L==='inline'  ) runs=[buildRun('h','down',0,0,G[0],[false,false],fb)];
  else if(L==='alcove') runs=[buildRun('h','down',0,0,G[0],[true,true],fb)];
  else if(L==='island'){
    const top=buildRun('h','up',   0,0, G[0], null, dB||fb);
    const bot=buildRun('h','down', 0, top.depth, G[1], null, dA||fb);
    runs=[top,bot];
  } else if(L==='corner-l'){
    const hor=buildRun('h','down',0,0, G[0], [true,false], dB||fb);
    const ver=buildRun('v','right',0, hor.depth, G[1], [true,false], dA||fb);
    runs=[hor,ver];
  }
  runs.forEach((r,i)=>{ r.runIdx=i; });
  // bounds
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  runs.forEach(r=>{
    const rx1 = r.orient==='h' ? r.x+r.length : r.x+r.depth;
    const ry1 = r.orient==='h' ? r.y+r.depth  : r.y+r.length;
    x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,rx1); y1=Math.max(y1,ry1);
  });
  return {runs, bounds:{x0,y0,x1,y1,w:x1-x0,d:y1-y0}};
}
/* plan (a,t)->(x,y) */
function P(r,a,t){
  if(r.orient==='h'){
    const x=r.x+a, y = r.facing==='down' ? r.y+t : r.y+r.depth-t;
    return {x,y};
  } else {
    const y=r.y+a, x = r.facing==='right' ? r.x+t : r.x+r.depth-t;
    return {x,y};
  }
}
function invP(r,x,y){
  if(r.orient==='h'){ const a=x-r.x, t= r.facing==='down'? y-r.y : r.y+r.depth-y; return {a,t}; }
  else { const a=y-r.y, t= r.facing==='right'? x-r.x : r.x+r.depth-x; return {a,t}; }
}
function doorLayout(st){
  const c=st.cfg, stallW=st.aEnd-st.aStart;
  const op=Math.min(c.doorOpening, stallW);
  const slack=Math.max(0, stallW-op);
  let lp,rp;
  if(c.doorPosition==='left'){ lp=0; rp=slack; }
  else if(c.doorPosition==='right'){ lp=slack; rp=0; }
  else { lp=slack/2; rp=slack/2; }
  const doorStart=st.aStart+lp, doorEnd=doorStart+op;
  const left=c.doorSwing.includes('left'), inward=c.doorSwing.includes('in');
  return {op,lp,rp,doorStart,doorEnd,left,inward,
          hingeA:left?doorStart:doorEnd, closeA:left?doorEnd:doorStart, dir:left?1:-1};
}
/* Divisiones de una hilera. Cada frontera toma la profundidad y la altura de
   las unidades que separa: entre dos mingitorios es una mampara corta, junto a
   una cabina es un panel completo. Antes toda la hilera usaba un solo valor. */
function runBoundaries(r){
  const L=r.stalls, out=[];
  if(!L.length) return out;
  const at=(a,left,right)=>{
    const us=[left,right].filter(Boolean);
    out.push({ a:Math.max(0,Math.min(r.length,a)),
               depth:Math.max(...us.map(u=>u.depth)),
               tall:us.some(u=>!isUrinalUnit(u.cfg)) });
  };
  at(0, null, L[0]);
  L.forEach((st,i)=>{ if(i<L.length-1) at((st.aEnd+L[i+1].aStart)/2, st, L[i+1]); });
  at(r.length, L[L.length-1], null);
  return out;
}

/* ── Mover unidades entre hileras ─────────────────────────────── */
/* Hilera efectiva de la unidad i: mientras el reparto sea automático manda el
   50/50; después manda su propio `run`. */
function unitRun(i){
  const r=state.room;
  if(runCount(r.layout)===1) return 0;
  if(r.splitAuto) return i < Math.ceil(r.stalls.length/2) ? 0 : 1;
  return r.stalls[i].run|0;
}
function unitIdx(run){
  const out=[]; state.room.stalls.forEach((_,i)=>{ if(unitRun(i)===run) out.push(i); }); return out;
}
/* Congela el 50/50 automático en los `run` de cada unidad. Se llama antes de
   cualquier acción manual: sin esto, salir de `splitAuto` mandaría todo a A. */
function materializeSplit(){
  if(!state.room.splitAuto) return;
  const n=runCount(state.room.layout), k=Math.ceil(state.room.stalls.length/2);
  state.room.stalls.forEach((u,i)=>{ u.run = (n>1 && i>=k) ? 1 : 0; });
  state.room.splitAuto=false;
}
/* Reubica la unidad `gi` en `run`, justo antes de `beforeGi` (-1 = al final).
   El orden dentro de una hilera es el del arreglo, así que basta con reinsertar. */
function moveUnitTo(gi, run, beforeGi){
  const list=state.room.stalls, u=list[gi];
  if(!u) return;
  list.splice(gi,1);
  u.run=run;
  const at = beforeGi<0 ? list.length : (beforeGi>gi ? beforeGi-1 : beforeGi);
  list.splice(Math.max(0,Math.min(list.length,at)), 0, u);
  const at2=list.indexOf(u);
  setSel([at2], at2);                            // reordenar invalida los índices previos
}

/* ═══════════════ Precio y análisis ═══════════════ */
/* Mamparas de mingitorio: cada grupo contiguo de u mingitorios necesita u+1
   (una entre cada par, más las dos de los extremos). Un vecino de tipo cabina
   corta el grupo, porque esa frontera ya la cierra el panel de la cabina. */
function countScreens(){
  let s=0;
  computeRuns().runs.forEach(r=>{
    let open=false;
    r.stalls.forEach(st=>{
      const u=isUrinalUnit(st.cfg);
      if(u){ if(!open){ s++; open=true; } s++; } else open=false;
    });
  });
  return s;
}
function computeQuote(){
  const r=state.room, m=MATERIALS.find(x=>x.id===state.materialId);
  const units=r.stalls, n=units.length;
  const nStall=units.filter(u=>!isUrinalUnit(u)).length, nUrinal=n-nStall;
  const screens=countScreens(), perScreen=Math.round(m.perStall*0.5);
  const stalls=nStall*m.perStall, doors=nStall*90, hardware=nStall*65;
  const screensCost=screens*perScreen, brackets=screens*40;
  const ada=units.some(u=>u.ada)?520:0;
  const nPriv=units.filter(u=>u.privacy && !isUrinalUnit(u)).length, privacy=nPriv*120;
  const backPanel = r.back==='panel' ? n*Math.round(m.perStall*0.45) : 0;
  const subtotal=stalls+doors+hardware+screensCost+brackets+ada+privacy+backPanel;
  const shipping=nStall?180:140, total=subtotal+shipping;
  return {m,n,nStall,nUrinal,nPriv,screens,perScreen,screensCost,brackets,
          stalls,doors,hardware,ada,privacy,backPanel,subtotal,shipping,total};
}
function analysis(){
  const {bounds,runs}=computeRuns();
  const live=runs.filter(r=>!r.empty);
  const wall=live.reduce((s,r)=>s+r.length,0);
  const adaStall=state.room.stalls.find(s=>s.ada);
  const adaOk = !state.room.ada || (adaStall && (adaStall.stallWidth+adaStall.stallWidthFrac)>=60);
  // recomendación
  const n=state.room.stalls.length, ratio=bounds.w/Math.max(1,bounds.d);
  let rec='inline';
  if(n>=6) rec='island'; else if(n>=3 && ratio<2.4) rec='corner-l';
  return {W:bounds.w, D:bounds.d, wall, adaOk, adaStall, rec, runs:live};
}

/* ═══════════════ Vista 2D (canvas) ═══════════════ */
const canvas=document.getElementById('view2d'), ctx=canvas.getContext('2d');
let map=null, pickRuns=[], drag=null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function draw2D(){
  const wrap=document.getElementById('canvasWrap'), dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);

  const {runs,bounds}=computeRuns();
  // La elevación vive en una columna derecha reservada: la planta se dibuja a su izquierda.
  const eb=elevBox(W,H);
  const mg={t:64, r: eb ? (W-eb.x0)+24 : 60, b:64, l:70};
  const s=Math.min((W-mg.l-mg.r)/Math.max(1,bounds.w),(H-mg.t-mg.b)/Math.max(1,bounds.d));
  const ox=mg.l+((W-mg.l-mg.r)-bounds.w*s)/2 - bounds.x0*s;
  const oy=mg.t+((H-mg.t-mg.b)-bounds.d*s)/2 - bounds.y0*s;
  map={s,ox,oy};
  const M=(x,y)=>({X:ox+x*s, Y:oy+y*s});

  pickRuns=runs;
  const wall=state.colorHex;

  runs.forEach(r=>{
    if(r.empty){ emptyRunZone(r,M); return; }
    // resaltado + relleno de cada unidad (con su propia profundidad)
    r.stalls.forEach(st=>{
      const c=[P(r,st.aStart,0),P(r,st.aEnd,0),P(r,st.aEnd,st.depth),P(r,st.aStart,st.depth)].map(p=>M(p.x,p.y));
      ctx.beginPath(); ctx.moveTo(c[0].X,c[0].Y); c.slice(1).forEach(p=>ctx.lineTo(p.X,p.Y)); ctx.closePath();
      ctx.fillStyle = selHas(st.gi) ? 'rgba(147,60,68,.12)' : 'rgba(255,255,255,.55)';
      ctx.fill();
      if(selHas(st.gi)){                       // contorno: continuo el ancla, punteado el resto
        ctx.strokeStyle=css('--danger'); ctx.lineWidth=st.gi===state.selected?2:1.2;
        if(st.gi!==state.selected) ctx.setLineDash([5,4]);
        ctx.stroke(); ctx.setLineDash([]);
      }
      if(drag&&drag.moved&&st.gi===drag.gi){ ctx.globalAlpha=.35; ctx.fillStyle='rgba(147,60,68,.25)'; ctx.fill(); ctx.globalAlpha=1; }
    });
    // fondo: panel de fondo (producto), muro de concreto (referencia) u oculto
    if(state.room.back==='panel') strokePlan(r, [ [0,0],[r.length,0] ], wall, 6);
    else if(state.room.showWall) strokePlan(r, [ [0,0],[r.length,0] ], '#b3b8be', 9);
    // pilastras / divisiones: cada una con la profundidad de lo que separa
    runBoundaries(r).forEach(b=> strokePlan(r,[[b.a,0],[b.a,b.depth]], wall, b.tall?4:3));
    // muros laterales (nicho / esquina)
    if(r.sideWalls[0]) strokePlan(r,[[0,0],[0,r.depth]], wall, 7);
    if(r.sideWalls[1]) strokePlan(r,[[r.length,0],[r.length,r.depth]], wall, 7);
    // inodoros/mingitorios + puertas
    r.stalls.forEach(st=>{ if(isUrinalUnit(st.cfg)){ drawUrinal(r,st,M); } else { drawToilet(r,st,M); drawDoor(r,st,M,s); } });
    if(runs.length>1) runTag(r,M);
  });

  if(drag&&drag.moved) drawDropHint(M);
  // cotas de la cabina seleccionada
  const sel=findStall(state.selected);
  if(sel){ drawDims(sel.run, sel.st, M, s); }
  drawElevation(eb);

  function strokePlan(r, pts, color, w){
    ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath();
    pts.forEach((p,i)=>{ const q=P(r,p[0],p[1]), m=M(q.x,q.y); i?ctx.lineTo(m.X,m.Y):ctx.moveTo(m.X,m.Y); });
    ctx.stroke();
  }
}
function findStall(gi){
  const {runs}=computeRuns();
  for(const r of runs){ const st=r.stalls.find(s=>s.gi===gi); if(st) return {run:r,st}; }
  return null;
}
const runLetter = i => i? 'B' : 'A';
/* Hilera sin unidades: huella punteada para saber dónde caería lo que se arrastre. */
function emptyRunZone(r,M){
  const c=[P(r,0,0),P(r,r.length,0),P(r,r.length,r.depth),P(r,0,r.depth)].map(p=>M(p.x,p.y));
  const hot = drag&&drag.drop&&drag.drop.run===r.runIdx;
  ctx.save();
  ctx.setLineDash([6,5]); ctx.lineWidth=1.5;
  ctx.strokeStyle = hot? css('--danger') : 'rgba(120,130,145,.5)';
  ctx.fillStyle   = hot? 'rgba(147,60,68,.07)' : 'rgba(120,130,145,.05)';
  ctx.beginPath(); ctx.moveTo(c[0].X,c[0].Y); c.slice(1).forEach(p=>ctx.lineTo(p.X,p.Y)); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  const q=P(r,r.length/2,r.depth/2), m=M(q.x,q.y);
  ctx.fillStyle= hot? css('--danger') : 'rgba(120,130,145,.75)';
  ctx.font='700 10px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('HILERA '+runLetter(r.runIdx)+' · VACÍA', m.X, m.Y);
  ctx.restore();
}
function runTag(r,M){
  const q=P(r,-6,r.depth/2), m=M(q.x,q.y);
  ctx.save();
  ctx.fillStyle='rgba(120,130,145,.8)'; ctx.font='700 10px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(runLetter(r.runIdx), m.X, m.Y);
  ctx.restore();
}
/* Marca de inserción durante el arrastre: línea roja donde caerá la unidad. */
function drawDropHint(M){
  const d=drag&&drag.drop; if(!d) return;
  const r=pickRuns.find(x=>x.runIdx===d.run); if(!r) return;
  let a = r.length;
  if(d.beforeGi>=0){ const st=r.stalls.find(s=>s.gi===d.beforeGi); if(st) a=st.aStart-PL/2; }
  else if(r.stalls.length) a=r.stalls[r.stalls.length-1].aEnd+PL/2;
  else a=r.length/2;
  const p0=P(r,a,-4), p1=P(r,a,r.depth+4), m0=M(p0.x,p0.y), m1=M(p1.x,p1.y);
  ctx.save();
  ctx.strokeStyle=css('--danger'); ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(m0.X,m0.Y); ctx.lineTo(m1.X,m1.Y); ctx.stroke();
  ctx.restore();
}
/* Caja de la elevación: única fuente de verdad para su posición.
   La usa draw2D para reservar el margen derecho y drawElevation para dibujar.
   Devuelve null cuando no cabe (canvas angosto o bajo) → no se reserva columna. */
const ELEV_W=142, ELEV_H=206;
function elevBox(W,H){
  if(W<=520) return null;                   // canvas angosto: no mostrar
  const x0=W-ELEV_W-16, y0=H-ELEV_H-50;
  if(y0<8) return null;                     // no cabe a lo alto: omitir
  return {x0, y0, w:ELEV_W, h:ELEV_H};
}
function drawElevation(box){
  if(!box) return;
  const hIn=state.room.height, gIn=state.room.floorGap, tIn=hIn+gIn;
  const boxW=box.w, cardH=box.h, x0=box.x0, cardY=box.y0;
  ctx.save();
  const rr=(x,y,w,h,r)=>{ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
  ctx.fillStyle='rgba(255,255,255,.93)'; ctx.strokeStyle=css('--line'); ctx.lineWidth=1;
  rr(x0,cardY,boxW,cardH,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle=css('--ink-faint'); ctx.font='700 9px Inter,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('ELEVACIÓN (LATERAL)', x0+10, cardY+8);
  const baseY=cardY+cardH-24, topArea=cardY+30, eScale=(baseY-topArea)/Math.max(60,tIn+6);
  const bx=x0+50, bw=24, panelBottom=baseY-gIn*eScale, panelTop=baseY-tIn*eScale;
  // muro de fondo (contexto): concreto gris o panel del material, sube casi al techo
  const wallTop=topArea-4;
  ctx.save(); ctx.globalAlpha = state.room.back==='panel'?0.5:0.85;
  ctx.fillStyle = state.room.back==='panel'? state.colorHex : '#c2c6ca';
  ctx.fillRect(bx-9, wallTop, 7, baseY-wallTop); ctx.restore();
  // piso + hachurado
  ctx.strokeStyle=css('--ink-dim'); ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(bx-34,baseY); ctx.lineTo(bx+bw+34,baseY); ctx.stroke();
  ctx.strokeStyle=css('--ink-faint'); ctx.lineWidth=1;
  for(let hx=bx-32; hx<bx+bw+32; hx+=6){ ctx.beginPath(); ctx.moveTo(hx,baseY); ctx.lineTo(hx-4,baseY+5); ctx.stroke(); }
  // soporte al piso si flota
  if(gIn>0){ ctx.strokeStyle=css('--ink-faint'); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(bx+bw/2,panelBottom); ctx.lineTo(bx+bw/2,baseY); ctx.stroke(); ctx.setLineDash([]); }
  // panel (material)
  ctx.fillStyle=state.colorHex; rr(bx,panelTop,bw,panelBottom-panelTop,3); ctx.fill();
  // cotas: izquierda Alto/Piso, derecha Total
  vdim(bx-18, panelTop, panelBottom, hIn+'"', 'Alto', 'right');
  if(gIn>0) vdim(bx-18, panelBottom, baseY, gIn+'"', 'Piso', 'right');
  vdim(bx+bw+16, panelTop, baseY, tIn+'"', 'Total', 'left');
  ctx.restore();
  function vdim(x,yA,yB,label,cap,side){
    ctx.strokeStyle=css('--danger'); ctx.fillStyle=css('--danger'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,yA); ctx.lineTo(x,yB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-3,yA); ctx.lineTo(x+3,yA); ctx.moveTo(x-3,yB); ctx.lineTo(x+3,yB); ctx.stroke();
    ctx.textBaseline='middle'; ctx.textAlign = side==='right' ? 'right' : 'left';
    const tx = side==='right' ? x-5 : x+5, my=(yA+yB)/2;
    ctx.font='bold 10px Inter,sans-serif'; ctx.fillStyle=css('--danger'); ctx.fillText(label, tx, my-5);
    ctx.font='600 8px Inter,sans-serif'; ctx.fillStyle=css('--ink-faint'); ctx.fillText(cap, tx, my+6);
  }
}
function drawToilet(r,st,M){
  const back=P(r,st.aCenter,4), bowl=P(r,st.aCenter,16);
  const b=M(bowl.x,bowl.y), k=M(back.x,back.y), sc=map.s;
  ctx.save();
  ctx.strokeStyle='#9fb3c4'; ctx.fillStyle='#fbfdff'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.rect(k.X-9, k.Y-9, 18,18); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(b.X,b.Y, 11,11,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
  const rd=11;
  ctx.beginPath(); ctx.arc(b.X,b.Y,rd,0,Math.PI*2);
  ctx.fillStyle = selHas(st.gi) ? css('--danger') : css('--ink');
  ctx.fill();
  if(st.cfg.ada){ ctx.strokeStyle=css('--info'); ctx.lineWidth=2.4; ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.font='bold 12px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(st.gi+1), b.X, b.Y+0.5);
}
function drawUrinal(r,st,M){
  const back=P(r,st.aCenter,3), b=M(back.x,back.y);
  ctx.save();
  ctx.strokeStyle='#9fb3c4'; ctx.fillStyle='#fbfdff'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.ellipse(b.X,b.Y+9,8.5,12,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(b.X,b.Y+9,10,0,Math.PI*2);
  ctx.fillStyle = selHas(st.gi) ? css('--danger') : css('--ink'); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(st.gi+1), b.X, b.Y+9);
}
function drawDoor(r,st,M,s){
  const L=doorLayout(st);
  // paneles fijos del frente (cierran el vano; la puerta ya no flota)
  if(L.lp>0.5) frontWall(st.aStart, st.aStart+L.lp);
  if(L.rp>0.5) frontWall(st.aEnd-L.rp, st.aEnd);
  // hoja abatida, abisagrada en la pilastra/panel
  const aH=L.hingeA, along=L.dir, vert=L.inward?-1:1, th=50*Math.PI/180, len=L.op;
  const aL=aH+along*Math.cos(th)*len, tL=st.depth+vert*Math.sin(th)*len;
  const p0=P(r,aH,st.depth), p1=P(r,aL,tL), m0=M(p0.x,p0.y), m1=M(p1.x,p1.y);
  ctx.save();
  ctx.strokeStyle='rgba(110,120,136,.45)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  const pC=P(r,aH+along*len, st.depth), mc=M(pC.x,pC.y);
  ctx.beginPath(); ctx.moveTo(mc.X,mc.Y); ctx.lineTo(m0.X,m0.Y); ctx.lineTo(m1.X,m1.Y); ctx.stroke();

/* Clic = seleccionar. Arrastrar = mover la unidad de hilera o reordenarla.
   Se distingue por el umbral de 5 px, así un clic torpe no reacomoda el baño. */
function canvasPt(e){
  const rect=canvas.getBoundingClientRect();
  return {x:(e.clientX-rect.left-map.ox)/map.s, y:(e.clientY-rect.top-map.oy)/map.s};
}
function hitUnit(px,py){
  for(const r of pickRuns){
    if(r.empty) continue;
    const {a,t}=invP(r,px,py);
    if(t<-4||t>r.depth+4) continue;
    const st=r.stalls.find(s=>a>=s.aStart-PL && a<=s.aEnd+PL);
    if(st) return st.gi;
  }
  return null;
}
/* Hilera y punto de inserción bajo el cursor. Se elige la hilera MÁS CERCANA,
   no la que contenga el punto exacto: exigir puntería dentro de la huella hacía
   que el arrastre pareciera muerto cuando soltabas un poco fuera. */
function dropTarget(px,py){
  let best=null, bestD=Infinity;
  for(const r of pickRuns){
    const {a,t}=invP(r,px,py);
    const da = a<0 ? -a : (a>r.length ? a-r.length : 0);
    const dt = t<0 ? -t : (t>r.depth  ? t-r.depth  : 0);
    const d=Math.hypot(da,dt);
    if(d<bestD){ bestD=d; best={r,a}; }
  }
  if(!best || bestD>140) return null;        // a más de ~12 pies, fuera de todo
  let beforeGi=-1;
  for(const st of best.r.stalls){ if(best.a<st.aCenter){ beforeGi=st.gi; break; } }
  return {run:best.r.runIdx, beforeGi};
}
canvas.addEventListener('pointerdown',e=>{
  if(!map||e.button) return;
  const p=canvasPt(e), gi=hitUnit(p.x,p.y);
  if(gi==null) return;
  drag={gi, sx:e.clientX, sy:e.clientY, moved:false, drop:null, px:p.x, py:p.y};
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  if(!map) return;
  if(!drag){                                  // sin arrastrar: solo la pista del cursor
    const p=canvasPt(e);
    canvas.style.cursor = hitUnit(p.x,p.y)!=null ? 'grab' : '';
    return;
  }
  if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy)<5) return;
  drag.moved=true; canvas.style.cursor='grabbing';
  const p=canvasPt(e); drag.px=p.x; drag.py=p.y;
  drag.drop=dropTarget(p.x,p.y);
  draw2D();
});
canvas.addEventListener('pointerup',e=>{
  if(!drag) return;
  const d=drag; drag=null; canvas.style.cursor='';
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
  if(!d.moved){
    selectStall(d.gi, e.shiftKey ? 'range' : (e.ctrlKey||e.metaKey) ? 'toggle' : 'set');
    return;
  }
  if(d.drop){
    materializeSplit();
    moveUnitTo(d.gi, d.drop.run, d.drop.beforeGi);
    framed=false; refreshStallSelect(); renderStep(); render();
  } else draw2D();
});
canvas.addEventListener('pointercancel',()=>{ drag=null; canvas.style.cursor=''; draw2D(); });
canvas.addEventListener('pointerleave',()=>{ if(!drag) canvas.style.cursor=''; });

const host=document.getElementById('view3d');
let renderer,scene,camera,controls,rootG,ray,ptr,running=false,framed=false,pick3d=[],sun=null,steelMat=null,chromeMat=null,doorAnims=[],tour={active:false,start:0},clock=null,animateOpenOnce=false,concreteTex=null;

/* Acero inoxidable cepillado: textura procedural (albedo + rugosidad + relieve)

function getSteel(){
  if(steelMat) return steelMat;
  const w=512,h=512;
  const base=document.createElement('canvas'); base.width=w; base.height=h; const bg=base.getContext('2d');
  bg.fillStyle='#c4c9cd'; bg.fillRect(0,0,w,h);
  for(let i=0;i<15000;i++){ const y=Math.random()*h,x=Math.random()*w,len=15+Math.random()*170;
    const dark=Math.random()<0.5, v=dark?(90+Math.random()*60):(200+Math.random()*55);
    bg.strokeStyle=`rgba(${v|0},${v|0},${(v+3)|0},${0.03+Math.random()*0.05})`; bg.lineWidth=Math.random()<0.5?1:0.6;
    bg.beginPath(); bg.moveTo(x,y); bg.lineTo(x+len,y); bg.stroke(); }
  const map=new THREE.CanvasTexture(base); map.colorSpace=THREE.SRGBColorSpace;
  map.wrapS=map.wrapT=THREE.RepeatWrapping; map.anisotropy=8; map.repeat.set(2,3);
  const rc=document.createElement('canvas'); rc.width=w; rc.height=h; const rg=rc.getContext('2d');
  rg.fillStyle='#7c7c7c'; rg.fillRect(0,0,w,h);
  for(let i=0;i<17000;i++){ const y=Math.random()*h,x=Math.random()*w,len=15+Math.random()*210;
    const v=Math.random()<0.5?55:185; rg.strokeStyle=`rgba(${v},${v},${v},.07)`;
    rg.beginPath(); rg.moveTo(x,y); rg.lineTo(x+len,y); rg.stroke(); }
  const rough=new THREE.CanvasTexture(rc); rough.wrapS=rough.wrapT=THREE.RepeatWrapping; rough.repeat.set(2,3);
  steelMat=new THREE.MeshPhysicalMaterial({ color:0xd7dbde, metalness:1.0, roughness:.42,
    map, roughnessMap:rough, bumpMap:map, bumpScale:.015, envMapIntensity:1.3,
    anisotropy:1.0, anisotropyRotation:Math.PI/2 });
  return steelMat;
}
function build3D(reframe){
  if(!renderer) init3D();

  pick3d=[]; doorAnims=[];
  const {runs,bounds}=computeRuns();
  const partH=state.room.height*S, gap=state.room.floorGap*S, top=gap+partH;
  const inox = state.materialId==='inox';
  const steel = inox ? getSteel() : null;
  const wallMat = inox ? steel : new THREE.MeshStandardMaterial({color:new THREE.Color(state.colorHex),roughness:.82,envMapIntensity:.5});
  const doorMat = inox ? steel : new THREE.MeshStandardMaterial({color:new THREE.Color(state.colorHex).offsetHSL(0,0,.08),roughness:.7,envMapIntensity:.5});

  // suelo general
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(bounds.w*S+2,bounds.d*S+2),floorMat);
  floor.rotation.x=-Math.PI/2; floor.position.set((bounds.x0+bounds.w/2)*S,0,(bounds.y0+bounds.d/2)*S);

    if(state.room.back==='panel'){
      addBox(g, r.length*S, partH, 1.4*S, r.length*S/2, gap+partH/2, -0.7*S, wallMat);
    } else if(state.room.showWall){
      addBox(g, r.length*S, top+18*S, PL*S, r.length*S/2, (top+18*S)/2, -PL*S/2, concreteMat);
    }
    // pilastras: alto y fondo según las unidades que separa (mampara corta vs panel)
    const bs=runBoundaries(r);
    const divH=b=>b.tall?top:partH, divY=b=>b.tall?top/2:gap+partH/2;
    bs.forEach(b=> addBox(g, PL*S, divH(b), b.depth*S, b.a*S, divY(b), b.depth*S/2, wallMat));
    const sideH = hasStall?top:partH, sideY = hasStall?top/2:gap+partH/2;
    if(r.sideWalls[0]) addBox(g, PL*S, sideH, r.depth*S, 0, sideY, r.depth*S/2, wallMat);
    if(r.sideWalls[1]) addBox(g, PL*S, sideH, r.depth*S, r.length*S, sideY, r.depth*S/2, wallMat);
    if(r===live[0]) addHeightDim(g, top, gap, r.depth);

    bs.forEach(b=>{ if(b.tall) addShoe(g, b.a, b.depth); });
    if(hasStall && state.room.headrail!=='none') addHeadrail(g, r, top, state.room.headrail);
    r.stalls.forEach(st=>{
      if(selHas(st.gi)){
        const hl=new THREE.Mesh(new THREE.PlaneGeometry((st.aEnd-st.aStart)*S, st.depth*S),
          new THREE.MeshStandardMaterial({color:0x933c44,transparent:true,opacity:.14}));
        hl.rotation.x=-Math.PI/2; hl.position.set(st.aCenter*S,.02,st.depth*S/2); g.add(hl);
      }

function addBox(g,w,h,d,x,y,z,m){ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); b.position.set(x,y,z); b.castShadow=true; b.receiveShadow=true; g.add(b); }

function addDoor(g,st,gap,partH,m){

  if(L.rp>0.5) addFrontPanel(g, st.aEnd-L.rp, st.aEnd, gap, partH, st.depth, m);
  const grp=new THREE.Group();
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(openW,partH,1.2*S),m);

/* ── Herrajes metálicos (cromo) ─────────────────────────────── */
function getChrome(){

function addHook(grp,dir,openW,partH){
  const g=getChrome(); const topY=partH/2-3*S, x=dir*openW*0.5, z=-.65*S;
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.5*S,.5*S,.35*S,10),g);

function addStrike(g,boundaryA,gap,partH,depth){

function addShoe(g,a,depth){

  shoe.position.set(a*S,2*S,depth*S/2); shoe.castShadow=true; shoe.receiveShadow=true; g.add(shoe);

/* Riel superior. Va APOYADO sobre el canto de las pilastras, no incrustado a
   media altura, y solo abarca de la primera a la última: así se ve que une
   algo en vez de flotar. 'total' lo corre por todo el frente de la hilera. */
function addHeadrail(g, r, top, kind){
  const m=getChrome();
  const tall=runBoundaries(r).filter(b=>b.tall);
  if(tall.length<2) return;                        // sin dos apoyos no hay riel
  const a0 = kind==='total' ? 0 : tall[0].a;
  const a1 = kind==='total' ? r.length : tall[tall.length-1].a;
  const len = a1-a0;
  if(len<=0) return;
  const depth = Math.max(...tall.map(b=>b.depth));
  if(kind==='flush'){
    // Al ras: corona el canto superior con el mismo fondo que la pilastra.
    const cap=new THREE.Mesh(new THREE.BoxGeometry(len*S, 1.2*S, depth*S), m);
    cap.position.set((a0+len/2)*S, top+0.6*S, depth*S/2);
    cap.castShadow=true; cap.receiveShadow=true; g.add(cap);
  } else {
    // Corrido: tubo al frente, apoyado sobre el canto.
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len*S, 1.5*S, 1.5*S), m);
    rail.position.set((a0+len/2)*S, top+0.75*S, depth*S);
    rail.castShadow=true; rail.receiveShadow=true; g.add(rail);
  }
}

}

/* Concreto procedural para el muro de referencia */
function getConcreteTex(){
  if(concreteTex) return concreteTex;
  const w=512,h=512, c=document.createElement('canvas'); c.width=w;c.height=h; const g=c.getContext('2d');
  g.fillStyle='#c6cace'; g.fillRect(0,0,w,h);
  for(let i=0;i<180;i++){ const x=Math.random()*w,y=Math.random()*h,r=20+Math.random()*90;
    const v=190+Math.floor(Math.random()*40); g.fillStyle=`rgba(${v},${v+2},${v+4},0.05)`;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
  for(let i=0;i<9000;i++){ const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.6;
    const d=Math.random()<0.5, v=d?120+Math.random()*40:210+Math.random()*40;
    g.fillStyle=`rgba(${v|0},${v|0},${v|0},${0.15+Math.random()*0.2})`;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
  for(let i=0;i<120;i++){ const x=Math.random()*w,y=Math.random()*h,r=1+Math.random()*2.5;
    g.fillStyle='rgba(80,84,90,0.25)'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
  concreteTex=new THREE.CanvasTexture(c); concreteTex.colorSpace=THREE.SRGBColorSpace;
  concreteTex.wrapS=concreteTex.wrapT=THREE.RepeatWrapping; concreteTex.repeat.set(3,2);
  return concreteTex;
}
function getConcreteMat(){
  const tex=getConcreteTex();
  return new THREE.MeshStandardMaterial({color:0xcfd2d6, map:tex, bumpMap:tex, bumpScale:.02,
    roughness:1, metalness:0, envMapIntensity:.22});
}
/* Etiqueta 3D (píldora blanca con texto rojo) para cotas */
function makeLabelSprite(text){
  const f=48, pad=10;
  const meas=document.createElement('canvas').getContext('2d'); meas.font='bold '+f+'px Inter,sans-serif';
  const tw=meas.measureText(text).width;
  const cv=document.createElement('canvas'); cv.width=Math.ceil(tw+pad*2); cv.height=f+pad*2;
  const c=cv.getContext('2d'); c.font='bold '+f+'px Inter,sans-serif';
  const rr=(x,y,w2,h2,r)=>{ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w2,y,x+w2,y+h2,r); c.arcTo(x+w2,y+h2,x,y+h2,r); c.arcTo(x,y+h2,x,y,r); c.arcTo(x,y,x+w2,y,r); c.closePath(); };
  c.fillStyle='#ffffff'; rr(1,1,cv.width-2,cv.height-2,14); c.fill();
  c.strokeStyle='#933c44'; c.lineWidth=3; rr(2.5,2.5,cv.width-5,cv.height-5,12); c.stroke();
  c.fillStyle='#933c44'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(text,cv.width/2,cv.height/2+1);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  const hh=6*S; sp.scale.set(hh*cv.width/cv.height, hh, 1);
  return sp;
}
/* Cota vertical: altura total y separación del piso */
function addHeightDim(g, top, gap, depth){
  const x=-5*S, z=depth*S+2*S;
  const mat=new THREE.LineBasicMaterial({color:0x933c44});
  const L=(a,b)=> g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),mat));
  L(new THREE.Vector3(x,0,z), new THREE.Vector3(x,top,z));
  [0,gap,top].forEach(y=> L(new THREE.Vector3(x-1.6*S,y,z), new THREE.Vector3(x+1.6*S,y,z)));
  const la=makeLabelSprite('Alto '+state.room.height+'\"'); la.position.set(x-7*S,(gap+top)/2,z); g.add(la);
  if(gap>0){ const lb=makeLabelSprite('Piso '+state.room.floorGap+'\"'); lb.position.set(x-7*S, gap/2, z); g.add(lb); }
}
function resize3D(){ if(!renderer) return; const w=host.clientWidth,h=host.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
function loop(){
  if(!running) return;
  const dt=Math.min(.05, clock?clock.getDelta():.016), now=performance.now()/1000;
  if(tour.active){
    const el=now-tour.start;
    doorAnims.forEach((d,i)=>{ d.target = el>(0.6+i*0.4)?1:0; });
    controls.autoRotate=true; controls.autoRotateSpeed=1.7;
    if(el>0.6+doorAnims.length*0.4+9){ tour.active=false; controls.autoRotate=false; }
  }
  doorAnims.forEach(d=>{ d.cur += (d.target-d.cur)*Math.min(1,dt*5); d.group.rotation.y=d.openAngle*d.cur; });
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
}

/* mode: 'set' reemplaza · 'toggle' suma/quita (Ctrl) · 'range' hasta el ancla (Shift) */
function selectStall(i,mode){
  const n=state.room.stalls.length;
  i=Math.max(0,Math.min(n-1,i));
  if(mode==='toggle'){
    const next = selHas(i) ? state.sel.filter(x=>x!==i) : [...state.sel,i];
    setSel(next.length?next:[i], i);
  } else if(mode==='range'){
    const a=state.selected, lo=Math.min(a,i), hi=Math.max(a,i);
    const range=[]; for(let k=lo;k<=hi;k++) range.push(k);
    setSel(range, a);
  } else setSel([i], i);
  document.getElementById('stallSelect').value=state.selected;
  if(state.step===2) renderStep();
  render();
}

          </div>
          ${fino}
        </div>
      </details>
      ${isU?'<div class="ui-alert ui-alert-info" style="margin-top:var(--space-2)">Mamparas colgadas de muro, sin puerta.</div>':''}
      ${c.ada?'<div class="ui-alert ui-alert-info" style="margin-top:var(--space-2)">Cabina ADA: mínimo 60\" y puerta hacia afuera.</div>':''}`;
    body.querySelectorAll('[data-preset]').forEach(el=> el.addEventListener('click',()=>applyPreset(el.dataset.preset)));
    body.querySelectorAll('[data-cfg]').forEach(sel=> sel.addEventListener('change',e=>{
      if(e.target.value==='') return;                       // seguía en "— varios —"
      const k=sel.dataset.cfg, num=['partitionDepth','stallWidth','stallWidthFrac','doorOpening'].includes(k);
      const v = num? parseFloat(e.target.value): e.target.value;
      editTargets().forEach(i=>{ r.stalls[i][k]=v; });
      render();
    }));
    const pc=document.getElementById('privChk');
    if(pc) pc.addEventListener('change',e=>{ editTargets().forEach(i=>{ r.stalls[i].privacy=e.target.checked; }); render(); });
    body.querySelectorAll('[data-room]').forEach(sel=> sel.addEventListener('change',e=>{
      state.room[sel.dataset.room]=parseFloat(e.target.value); state.room.mount='custom'; framed=false; renderStep(); render();
    }));
    body.querySelectorAll('#mountSeg .ui-seg').forEach(b=> b.addEventListener('click',()=>setMount(b.dataset.mount)));
    body.querySelectorAll('#railSeg .ui-seg').forEach(b=> b.addEventListener('click',()=>{
      state.room.headrail=b.dataset.rail; renderStep(); render();
    }));
    body.querySelectorAll('[data-moveto]').forEach(b=> b.addEventListener('click',()=>{
      materializeSplit(); moveUnitTo(state.selected, +b.dataset.moveto, -1);
      framed=false; refreshStallSelect(); renderStep(); render();
    }));
    body.querySelectorAll('[data-scope]').forEach(b=> b.addEventListener('click',()=>applyScope(b.dataset.scope)));
  }

  else if(state.step===3){
    body.innerHTML=`
      <p class="ui-meta" style="margin-top:0">Elige el material. El diseño y el precio se ajustan; la comparación usa las medidas de tu proyecto.</p>
      ${MATERIALS.map(x=>{ const q=quoteFor(x.id);
        return `<div class="mat-card ${x.id===state.materialId?'is-active':''}" data-mat="${x.id}">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="width:26px;height:26px;border-radius:6px;flex:none;background:${x.colors[0]};border:1px solid rgba(0,0,0,.14)"></span>
            <div><b>${x.name}</b><div class="ui-meta">${'$'.repeat(x.lvl)} · ${x.warranty} · ${x.tag}</div></div>
          </div>
          <div class="mono" style="text-align:right"><b>${money(q)}</b></div>
        </div>`;}).join('')}
      <div class="ui-alert ui-alert-info" style="margin-top:var(--space-3)">
        <b>${MATERIALS.find(x=>x.id===state.materialId).name}:</b>
        ${MATERIALS.find(x=>x.id===state.materialId).desc} Garantía ${MATERIALS.find(x=>x.id===state.materialId).warranty}.
      </div>`;
    body.querySelectorAll('.mat-card').forEach(el=> el.addEventListener('click',()=>{
      state.materialId=el.dataset.mat;
      state.colorHex=MATERIALS.find(x=>x.id===state.materialId).colors[0];
      renderStep(); render();
    }));
  }

  else if(state.step===4){
    const q=computeQuote();
    body.innerHTML=`
      <p class="ui-meta" style="margin-top:0">Revisa el desglose. El precio está garantizado 30 días.</p>
      <div class="ui-field"><label>Código postal (afina el envío)</label>
        <input id="zip" type="text" inputmode="numeric" maxlength="5" placeholder="00000" value="${state.zip}"></div>
      <div class="ui-alert ui-alert-ok"><b>Proyecto listo.</b>
        ${[q.nStall?q.nStall+' cabinas':'', q.nUrinal?q.nUrinal+' mingitorios':''].filter(Boolean).join(' y ')}
        en ${q.m.name}, distribución ${LAYOUTS.find(l=>l.id===state.room.layout).name.toLowerCase()}.</div>
      <button class="ui-btn ui-btn-primary ui-btn-block" id="orderBtn">Solicitar cotización formal</button>
      <div class="ui-form" style="gap:var(--space-2);margin-top:var(--space-2)">
        <button class="ui-btn" id="pdfBtn">Descargar PDF</button>
        <button class="ui-btn" id="shareBtn">Compartir enlace</button>
      </div>`;
    const zip=document.getElementById('zip'); zip.addEventListener('input',e=>{ state.zip=e.target.value.replace(/\D/g,''); });
    document.getElementById('orderBtn').addEventListener('click',()=>UI&&UI.toast?UI.toast('Cotización enviada a un experto','ok'):toast('Cotización enviada'));
    document.getElementById('pdfBtn').addEventListener('click',()=>toast('PDF generado (demo)'));
    document.getElementById('shareBtn').addEventListener('click',()=>toast('Enlace copiado: /p/MAU-'+Math.random().toString(36).slice(2,7).toUpperCase()));
  }
}

function countRow(label,key,val,sub){
  return `<div class="count-row"><div><b>${label}</b><small>${sub}</small></div>
    <div class="counter" data-counter="${key}">
      <button type="button" data-d="-1">−</button><output>${val}</output><button type="button" data-d="1">+</button>
    </div></div>`;
}
function bindCounter(el){
  const key=el.dataset.counter;
  el.querySelectorAll('button').forEach(b=> b.addEventListener('click',()=>{
    setUnitCount(key, countKind(key)+ (+b.dataset.d));
    renderStep(); render();
  }));
}
/* Alta/baja de unidades de un tipo sin tocar las del otro. Las nuevas heredan la
   hilera de la última, que es donde el usuario venía trabajando. */
function setUnitCount(kind,n){
  const list=state.room.stalls, cur=countKind(kind), other=list.length-cur;
  n=Math.max(0,Math.min(10,n));
  if(n===cur || n+other<1 || n+other>16) return;
  if(n>cur){
    const run = list.length? (list[list.length-1].run|0) : 0;
    for(let i=cur;i<n;i++) list.push(defaultStall(kind,run));
  } else {
    for(let i=cur;i>n;i--){
      let idx=-1; list.forEach((u,j)=>{ if(u.kind===kind) idx=j; });
      if(idx>=0) list.splice(idx,1);
    }
  }
  if(state.selected>=list.length) state.selected=list.length-1;
  setSel([state.selected], state.selected);      // los índices se corrieron
  if(!countKind('stall')) state.room.ada=false;
  if(state.room.ada) setAda(true,true);
  if(!layoutCompatible(state.room.layout,list.length)) state.room.layout='inline';
  refreshStallSelect(); framed=false;
}
/* ── Reparto entre hileras ──────────────────────────────────── */
function splitControl(){
  const A=unitIdx(0).length, B=unitIdx(1).length, auto=state.room.splitAuto;
  return `<div class="count-row" style="margin-top:var(--space-2)">
      <div><b>Reparto entre hileras</b><small>Cuántas unidades van de cada lado${auto?' · automático 50/50':''}</small></div>
      <div class="counter">
        <button type="button" data-split="-1">−</button><output>${A} / ${B}</output><button type="button" data-split="1">+</button>
      </div></div>
    <p class="ui-meta" style="margin:0 0 var(--space-2)">Hilera <b>A</b> ${A} · hilera <b>B</b> ${B}.
      También puedes arrastrar una unidad de una hilera a otra en el dibujo.
      ${auto?'':' <button type="button" id="resetSplit" class="ui-link" style="background:none;border:0;padding:0;font:inherit;cursor:pointer">Volver a automático</button>'}</p>`;
}
/* +1 pasa la primera de B al final de A; −1 pasa la última de A al inicio de B. */
function adjustSplit(d){
  materializeSplit();
  const A=unitIdx(0), B=unitIdx(1);
  if(d>0 && B.length) moveUnitTo(B[0], 0, -1);
  else if(d<0 && A.length) moveUnitTo(A[A.length-1], 1, B.length? B[0] : -1);
  else return;
  framed=false; refreshStallSelect(); renderStep(); render();
}
/* Un select con "— varios —" cuando lo seleccionado no comparte el mismo valor. */
function optMulti(list, vals){
  const u=[...new Set(vals)];
  return u.length===1 ? opt(list,u[0]) : `<option value="" selected>— varios —</option>`+opt(list,null);
}
/* Botonera de alcance: a qué unidades se aplica lo que edites abajo. */
function scopeControl(){
  const list=state.room.stalls, a=list[state.selected], act=activeScope();
  const kindName = isUrinalUnit(a) ? 'mingitorios' : 'cabinas';
  const btn=(s,label)=>`<button class="ui-seg ${act===s?'is-on':''}" type="button" data-scope="${s}" style="flex:1;min-width:88px">${label}</button>`;
  const two=runCount(state.room.layout)>1, nT=editTargets().length;
  // "Todo" solo aparece si de verdad abarca más que "Todas": dos hileras o tipos mezclados.
  const showAll = two || scopeIndices('kind').length<list.length;
  return `<div class="ui-label">Aplicar cambios a</div>
    <div class="ui-segmented" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
      ${btn('one','Solo esta')}
      ${btn('kind','Todas ('+scopeIndices('kind').length+')')}
      ${two?btn('run','Esta hilera ('+scopeIndices('run').length+')'):''}
      ${showAll?btn('all','Todo ('+list.length+')'):''}
    </div>
    <p class="ui-meta" style="margin:0 0 var(--space-3)">Cambiando <b>${nT}</b> ${nT===1?kindName.replace(/e?s$/,''):kindName}${state.sel.length>nT?` (de ${state.sel.length} seleccionadas)`:''}.
      En el dibujo: <b>Ctrl+clic</b> suma o quita una, <b>Shift+clic</b> toma un rango.</p>`;
}
/* Un preset está activo si TODO lo seleccionado ya coincide con sus medidas. */
function presetOf(kind, targets){
  const list=state.room.stalls;
  return (SIZE_PRESETS[kind]||[]).find(p=>
    targets.length && targets.every(i=>Object.keys(p.cfg).every(k=>list[i][k]===p.cfg[k]))
  ) || null;
}
function sizePresets(isU, targets){
  const kind=isU?'urinal':'stall', act=presetOf(kind,targets);
  return `<div class="preset-grid">${SIZE_PRESETS[kind].map(p=>`
    <div class="preset-card ${act&&act.id===p.id?'is-active':''}" data-preset="${p.id}">
      <b>${p.name}</b><span class="dim">${p.dim}</span><small>${p.desc}</small>
    </div>`).join('')}</div>
    ${act?'':'<p class="ui-meta" style="margin:-6px 0 var(--space-3)">Medidas a la carta. Elige un tamaño para volver a uno estándar.</p>'}`;
}
function applyPreset(id){
  const list=state.room.stalls, kind=isUrinalUnit(list[state.selected])?'urinal':'stall';
  const p=SIZE_PRESETS[kind].find(x=>x.id===id); if(!p) return;
  editTargets().forEach(i=>{ Object.assign(list[i], p.cfg); });
  if(state.room.ada) setAda(true,true);          // la cabina ADA no baja de 60"
  framed=false; renderStep(); render();
}
function moveControl(){
  if(runCount(state.room.layout)<2) return '';
  const cur=unitRun(state.selected), to=cur?0:1;
  return `<div class="ui-alert ui-alert-info" style="margin-top:0;display:flex;align-items:center;gap:10px;justify-content:space-between">
      <span>Está en la hilera <b>${runLetter(cur)}</b>.</span>
      <button class="ui-btn" type="button" data-moveto="${to}">Mover a hilera ${runLetter(to)}</button>
    </div>`;
}
function setAda(on,keep){
  const stalls=state.room.stalls.filter(s=>!isUrinalUnit(s));
  const last=stalls[stalls.length-1];
  state.room.ada = on && !!last;
  state.room.stalls.forEach(s=>s.ada=false);
  if(state.room.ada){ last.ada=true; if(last.stallWidth<60){ last.stallWidth=60; last.stallWidthFrac=0; } last.doorSwing='right-out'; }
  if(!keep){ renderStep(); render(); }
}
function layoutCompatible(id,n){ if(id==='island') return n>=4; if(id==='corner-l') return n>=3; return n>=1; }
function setBack(v){ state.room.back=v; renderStep(); render(); }
function setMount(m){
  state.room.mount=m;
  if(m==='standard'){ state.room.height=58; state.room.floorGap=12; }
  else if(m==='tall'){ state.room.height=72; state.room.floorGap=6; }
  else if(m==='fullheight'){ state.room.height=96; state.room.floorGap=0; state.room.back='panel'; }
  framed=false; renderStep(); render();
}
function quoteFor(matId){ const save=state.materialId; state.materialId=matId; const t=computeQuote().total; state.materialId=save; return t; }

/* Miniatura SVG por layout (usa los runs reales) */
function miniPreview(layoutId){
  const {runs,bounds}=computeRuns(layoutId);
  const W=78,H=58,pad=6;
  const s=Math.min((W-2*pad)/Math.max(1,bounds.w),(H-2*pad)/Math.max(1,bounds.d));
  const ox=pad+((W-2*pad)-bounds.w*s)/2-bounds.x0*s, oy=pad+((H-2*pad)-bounds.d*s)/2-bounds.y0*s;
  const M=(x,y)=>[ox+x*s,oy+y*s];
  let el='';
  runs.forEach(r=>{
    if(r.empty) return;
    r.stalls.forEach(st=>{
      const c=[P(r,st.aStart,0),P(r,st.aEnd,0),P(r,st.aEnd,st.depth),P(r,st.aStart,st.depth)].map(p=>M(p.x,p.y));
      el+=`<polygon points="${c.map(p=>p.join(',')).join(' ')}" fill="rgba(133,153,157,.18)"/>`;
    });
    const b0=M(...Object.values(P(r,0,0))), b1=M(...Object.values(P(r,r.length,0)));
    el+=`<line x1="${b0[0]}" y1="${b0[1]}" x2="${b1[0]}" y2="${b1[1]}" stroke="#4a7c7b" stroke-width="3" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${el}</svg>`;
}

/* ═══════════════ Navegación ═══════════════ */
function gotoStep(i){
  state.step=Math.max(0,Math.min(4,i));
  renderStepper(); renderStep(); render();
  document.getElementById('backBtn').style.visibility = state.step===0?'hidden':'visible';
  document.getElementById('nextBtn').textContent = state.step===4?'Finalizar':'Continuar';
  document.getElementById('footHint').textContent = STEPS[state.step].m;
}
document.getElementById('nextBtn').addEventListener('click',()=>{ if(state.step<4) gotoStep(state.step+1); else toast('¡Listo! Proyecto guardado.'); });
document.getElementById('backBtn').addEventListener('click',()=>gotoStep(state.step-1));
document.getElementById('roomName').addEventListener('input',e=>{ state.room.name=e.target.value; });

function toast(msg,type){ const box=document.querySelector('[data-ui-toasts]'); if(!box) return alert(msg);
  const t=document.createElement('div'); t.className='ui-toast'+(type?' ui-toast-'+type:''); t.textContent=msg;
  box.appendChild(t); setTimeout(()=>t.remove(),4000); }

/* Resize */
new ResizeObserver(()=>{ if(state.view==='2d') draw2D(); else resize3D(); }).observe(document.getElementById('canvasWrap'));

/* ═══════════════ Arranque ═══════════════ */
refreshStallSelect();
renderStepper();
gotoStep(0);
setView('2d');
</script>
