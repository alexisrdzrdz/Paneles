<style>
  :root{
    --bg:#f4f8fb;
    --panel:#ffffff;
    --ink:#1f2d3d;
    --muted:#7b8a9a;
    --line:#e3ebf2;
    --blue:#2f6fb0;
    --blue-d:#1f4f86;
    --wall:#4f7690;
    --red:#e23b3b;
    --green:#28a745;
    --navy:#12263f;
    --radius:8px;
    --shadow:0 1px 3px rgba(20,40,70,.08),0 6px 24px rgba(20,40,70,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ===== Barra de marca / logo ===== */
  .brandbar{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:10px 32px;
    display:flex;
    align-items:center;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand img,.brand svg{
    height:40px;width:auto;display:block;
  }
  .brand-name{
    font-size:22px;font-weight:800;letter-spacing:.5px;
    color:#2e6b2a;
  }

  /* ===== Stepper / encabezado ===== */
  .stepper{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:14px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
  .step .dot{
    width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;
    background:#cfd8e1;color:#fff;font-size:13px;font-weight:700;
  }
  .step.done{color:var(--green)}
  .step.done .dot{background:var(--green)}
  .step.active{color:var(--navy)}
  .step.active .dot{background:var(--navy)}

  /* ===== Layout principal ===== */
  main{
    flex:1;
    display:grid;
    grid-template-columns:300px 1fr;
    gap:0;
    min-height:0;
  }

  /* ===== Panel de controles ===== */
  aside{
    background:#fff;
    border-right:1px solid var(--line);
    padding:26px 24px;
    overflow:auto;
  }
  aside h2{
    margin:0 0 2px;
    font-size:22px;
    line-height:1.25;
    text-align:center;
    color:var(--ink);
  }
  .customize{
    text-align:center;
    color:var(--blue);
    font-weight:700;
    font-size:17px;
    margin-bottom:22px;
  }
  .field{margin-bottom:16px}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  select{
    width:100%;
    padding:8px 10px;
    font-size:13px;
    color:var(--ink);
    background:#fff;
    border:1px solid #cdd8e2;
    border-radius:6px;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237b8a9a' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 8px center;
    cursor:pointer;
  }
  select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,176,.15)}

  .stalls-count{
    margin-top:8px;padding-top:16px;border-top:1px dashed var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .stalls-count span{font-size:12.5px;font-weight:600}
  .counter{display:flex;align-items:center;gap:10px}
  .counter button{
    width:30px;height:30px;border-radius:6px;border:1px solid #cdd8e2;background:#fff;
    font-size:18px;line-height:1;cursor:pointer;color:var(--blue);font-weight:700;
  }
  .counter button:hover{background:#eef5fb}
  .counter b{min-width:20px;text-align:center;font-size:15px}

  /* ===== Visor ===== */
  .viewer{padding:24px 32px;display:flex;flex-direction:column;min-height:0}
  .viewer-top{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
  .roomname label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink)}
  .roomname input{
    width:100%;padding:9px 12px;font-size:14px;border:1px solid #cdd8e2;border-radius:6px;
  }
  .roomname input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,176,.15)}
  .viewer-tools{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stall-select{max-width:230px;flex:1}
  .toggle{display:inline-flex;border:1px solid var(--blue);border-radius:6px;overflow:hidden}
  .toggle button{
    border:0;background:#fff;color:var(--blue);font-weight:700;font-size:13px;
    padding:7px 18px;cursor:pointer;
  }
  .toggle button.active{background:var(--blue);color:#fff}

  .canvas-wrap{
    position:relative;
    flex:1;
    min-height:420px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  #view2d{display:block;width:100%;height:100%}
  #view3d{position:absolute;inset:0;display:none}
  #view3d canvas{display:block}

  .hint{
    position:absolute;right:16px;bottom:16px;
    background:#fff;border:1px solid var(--line);border-radius:22px;
    padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);
    box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
    pointer-events:none;
  }
  .hint .pt{font-size:16px}

  /* ===== Footer ===== */
  footer{
    background:#fff;border-top:1px solid var(--line);
    padding:16px 32px;display:flex;align-items:center;gap:16px;
  }
  .btn{
    border:0;border-radius:6px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn-back{background:#eef2f6;color:var(--ink);flex:0 0 300px}
  .btn-continue{background:var(--blue);color:#fff;flex:1}
  .btn-continue:hover{background:var(--blue-d)}
  .job{
    flex:0 0 auto;border:1px solid var(--line);border-radius:6px;padding:12px 16px;
    font-size:13px;font-weight:700;color:var(--muted);background:#fbfdff;
  }

  @media (max-width:880px){
    main{grid-template-columns:1fr}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    .btn-back{flex-basis:120px}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   ESTADO
   ========================================================= */
const OPTS = {
  partitionDepth:[54,57,60,63,66,69,72,78],
  stallWidth:[36,42,48,54,60,66,70],
  doorOpening:[24,26,28,30,32,34,36],
  swing:[['left-in','Left In'],['left-out','Left Out'],['right-in','Right In'],['right-out','Right Out']],
  position:[['center','Center'],['left','Left'],['right','Right']],
  frac:[['0','--'],['0.25','1/4"'],['0.5','1/2"'],['0.75','3/4"']]
};

function defaultStall(){
  return {
    partitionDepth:72,
    stallWidth:70, stallWidthFrac:0,
    doorOpening:34,
    doorSwing:'left-in',
    doorPosition:'center',
    toiletPosition:'center'
  };
}

const state = {
  roomName:'tets',
  view:'2d',
  selected:0,
  stalls:Array.from({length:5},()=>defaultStall())
};

const PL = 3; // grosor de pilastra/muro en pulgadas (para dibujo)

/* Calcula la geometría del run de cabinas (en pulgadas) */
function layout(){
  const stalls=[];
  let x = PL;                 // muro izquierdo
  let maxDepth = 0;
  state.stalls.forEach((c,i)=>{
    const w = c.stallWidth + c.stallWidthFrac;
    stalls.push({ index:i, x0:x, x1:x+w, width:w, depth:c.partitionDepth, cfg:c });
    x += w + PL;             // pilastra entre cabinas / muro derecho
    if(c.partitionDepth>maxDepth) maxDepth=c.partitionDepth;
  });
  return { stalls, totalWidth:x, maxDepth };
}

/* Posición del vano de puerta dentro de una cabina (en pulgadas) */
function doorSpan(s){
  const c=s.cfg;
  const slack = Math.max(0, s.width - c.doorOpening);
  let off = slack/2;
  if(c.doorPosition==='left')  off = Math.min(slack, PL);
  if(c.doorPosition==='right') off = Math.max(0, slack-PL);
  const start = s.x0 + off;
  return { start, end:start + c.doorOpening };
}

/* Centro del inodoro dentro de la cabina (en pulgadas) */
function toiletCenter(s){
  const c=s.cfg;
  if(c.toiletPosition==='left')  return s.x0 + s.width*0.30;
  if(c.toiletPosition==='right') return s.x0 + s.width*0.70;
  return (s.x0 + s.x1)/2;
}

function feetInches(inch){
  const ft=Math.floor(inch/12);
  const n=Math.round(inch-ft*12);
  return `${ft}'-${n}"`;
}

/* =========================================================
   VISTA 2D (canvas, planta cenital)
   ========================================================= */
const canvas = document.getElementById('view2d');
const ctx = canvas.getContext('2d');
let pick2d = []; // rectángulos en px para selección por clic

function draw2D(){
  const wrap = document.getElementById('canvasWrap');
  const dpr = window.devicePixelRatio||1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const L = layout();
  const margin = {t:64,r:60,b:70,l:90};
  const availW = W - margin.l - margin.r;
  const availH = H - margin.t - margin.b;
  const scale = Math.min(availW/L.totalWidth, availH/L.maxDepth);
  const drawW = L.totalWidth*scale, drawH = L.maxDepth*scale;
  const ox = margin.l + (availW-drawW)/2;
  const oy = margin.t + (availH-drawH)/2;

  const X = ix => ox + ix*scale;
  const Y = iy => oy + iy*scale;

  pick2d = [];

  // --- Resaltado de cabina seleccionada ---
  L.stalls.forEach(s=>{
    if(s.index===state.selected){
      ctx.fillStyle='rgba(226,59,59,.10)';
      ctx.fillRect(X(s.x0),Y(0),(s.x1-s.x0)*scale,s.depth*scale);
    }
    pick2d.push({i:s.index,x:X(s.x0),y:Y(0),w:(s.x1-s.x0)*scale,h:s.depth*scale});
  });

  // --- Muros y pilastras (azul) ---
  ctx.fillStyle = getCss('--wall');
  // muro trasero
  rect(X(0)-PL*scale, Y(0)-PL*scale, drawW+2*PL*scale, PL*scale);
  // muro izquierdo
  rect(X(0)-PL*scale, Y(0)-PL*scale, PL*scale, drawH+PL*scale);
  // muro derecho
  rect(X(L.totalWidth), Y(0)-PL*scale, PL*scale, drawH+PL*scale);
  // pilastras/divisiones internas
  for(let i=0;i<L.stalls.length-1;i++){
    const s=L.stalls[i];
    const d=Math.max(s.depth, L.stalls[i+1].depth);
    rect(X(s.x1), Y(0), PL*scale, d*scale);
  }

  // --- Inodoros ---
  L.stalls.forEach(s=> drawToilet(s,X,Y,scale));

  // --- Puertas ---
  L.stalls.forEach(s=> drawDoor(s,X,Y,scale));

  // --- Cotas (rojo) ---
  const sel = L.stalls[state.selected];
  // ancho total
  dimH(X(0), X(L.totalWidth), Y(0)-PL*scale-26, feetInches(L.totalWidth));
  // profundidad (izquierda) de la cabina seleccionada
  dimV(X(0)-PL*scale-30, Y(0), Y(sel.depth), `Depth ${sel.cfg.partitionDepth}"`);
  // ancho de la cabina seleccionada
  const wLabel = sel.cfg.stallWidth + (sel.cfg.stallWidthFrac? ' '+fracLabel(sel.cfg.stallWidthFrac):'');
  dimH(X(sel.x0), X(sel.x1), Y(sel.depth*0.33), `${wLabel}"`);
  // apertura de puerta (frente) de la seleccionada
  const dsp = doorSpan(sel);
  dimH(X(dsp.start), X(dsp.end), Y(sel.depth)+30, `${sel.cfg.doorOpening}"`);

  // helpers de dibujo
  function rect(x,y,w,h){ ctx.fillRect(x,y,w,h); }
}

function drawToilet(s,X,Y,scale){
  const cx = X(toiletCenter(s));
  const backY = Y(0)+2;
  const bowlW = 20*scale, bowlH = 26*scale, tankH = 8*scale, tankW=19*scale;
  ctx.save();
  ctx.strokeStyle='#9fb3c4'; ctx.fillStyle='#fbfdff'; ctx.lineWidth=1.4;
  // tanque
  roundRect(cx-tankW/2, backY, tankW, tankH, 3); ctx.fill(); ctx.stroke();
  // taza (elipse)
  ctx.beginPath();
  ctx.ellipse(cx, backY+tankH+bowlH*0.5, bowlW*0.5, bowlH*0.5, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // badge numerado
  const by = backY+tankH+bowlH*0.5;
  const r=11;
  ctx.beginPath(); ctx.arc(cx,by,r,0,Math.PI*2);
  ctx.fillStyle = (s.index===state.selected)? getCss('--red') : getCss('--navy');
  ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(s.index+1), cx, by+0.5);
}

function drawDoor(s,X,Y,scale){
  const c=s.cfg;
  const {start,end}=doorSpan(s);
  const left = c.doorSwing.includes('left');
  const inward = c.doorSwing.includes('in');
  const hingeIn = left? start : end;
  const hx = X(hingeIn), hy = Y(s.depth);
  const along = left? 1 : -1;
  const vert  = inward? -1 : 1;
  const theta = 60*Math.PI/180;
  const len = c.doorOpening*scale;
  const ex = hx + along*Math.cos(theta)*len;
  const ey = hy + vert*Math.sin(theta)*len;

  ctx.save();
  // arco de barrido
  ctx.strokeStyle='rgba(90,118,148,.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  const a0 = Math.atan2(0, along);
  const a1 = Math.atan2(ey-hy, ex-hx);
  ctx.beginPath(); ctx.arc(hx,hy,len,Math.min(a0,a1),Math.max(a0,a1)); ctx.stroke();
  // hoja de puerta
  ctx.setLineDash([]); ctx.strokeStyle=getCss('--wall'); ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.restore();
}

/* Cotas */
function dimH(x1,x2,y,label){
  ctx.save();
  ctx.strokeStyle=getCss('--red'); ctx.fillStyle=getCss('--red'); ctx.lineWidth=1.2;
  line(x1,y,x2,y);
  tick(x1,y); tick(x2,y);
  arrow(x1,y,1); arrow(x2,y,-1);
  pill((x1+x2)/2, y, label);
  ctx.restore();
  function tick(x,yy){ line(x,yy-5,x,yy+5); }
  function arrow(x,yy,dir){ ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+dir*7,yy-4); ctx.lineTo(x+dir*7,yy+4); ctx.closePath(); ctx.fill(); }
}
function dimV(x,y1,y2,label){
  ctx.save();
  ctx.strokeStyle=getCss('--red'); ctx.fillStyle=getCss('--red'); ctx.lineWidth=1.2;
  line(x,y1,x,y2);
  line(x-5,y1,x+5,y1); line(x-5,y2,x+5,y2);
  ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x-4,y1+7); ctx.lineTo(x+4,y1+7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x,y2); ctx.lineTo(x-4,y2-7); ctx.lineTo(x+4,y2-7); ctx.closePath(); ctx.fill();
  pill(x, (y1+y2)/2, label);
  ctx.restore();
}
function pill(cx,cy,text){
  ctx.font='bold 12px sans-serif';
  const w = ctx.measureText(text).width + 16;
  const h = 20;
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.strokeStyle=getCss('--red'); ctx.lineWidth=1.2;
  roundRect(cx-w/2, cy-h/2, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle=getCss('--red');
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, cx, cy+0.5);
  ctx.restore();
}
function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fracLabel(f){ const m={0.25:'1/4',0.5:'1/2',0.75:'3/4'}; return m[f]||''; }

/* Selección por clic en 2D */
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  for(const p of pick2d){
    if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){ selectStall(p.i); return; }
  }
});

/* =========================================================
   VISTA 3D (three.js)
   ========================================================= */
const S = 1/12;               // pulgadas -> pies
const host = document.getElementById('view3d');
let renderer, scene, camera, controls, root, raycaster, pointer, running=false, framed=false;
let pick3d=[];

function init3D(){
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0xeef4f9,1);
  host.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45,1,0.1,2000);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI*0.49;

  scene.add(new THREE.HemisphereLight(0xffffff,0x8593a3,1.0));
  const dir = new THREE.DirectionalLight(0xffffff,0.7);
  dir.position.set(20,40,25);
  scene.add(dir);

  root = new THREE.Group();
  scene.add(root);

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown',onPick3D);
}

const MAT = {
  floor:  new THREE.MeshStandardMaterial({color:0xdfe8ef,roughness:1}),
  wall:   new THREE.MeshStandardMaterial({color:0x4f7690,roughness:.85}),
  door:   new THREE.MeshStandardMaterial({color:0x6f93ab,roughness:.7}),
  porc:   new THREE.MeshStandardMaterial({color:0xf7fafc,roughness:.35,metalness:.05}),
  hlFloor:new THREE.MeshStandardMaterial({color:0xe23b3b,transparent:true,opacity:.14})
};

function build3D(reframe){
  if(!renderer) init3D();
  while(root.children.length) root.remove(root.children[0]);
  pick3d=[];

  const L = layout();
  const tw = L.totalWidth*S, md = L.maxDepth*S;
  const partH = 58*S, gap = 12*S, top = gap+partH;

  // suelo
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(tw+2, md+2), MAT.floor);
  floor.rotation.x = -Math.PI/2;
  floor.position.set(tw/2, 0, md/2);
  root.add(floor);

  // muro trasero
  addBox(tw+PL*2*S, top+6*S, PL*S, tw/2, (top+6*S)/2, -PL*S/2, MAT.wall);
  // muros laterales
  addBox(PL*S, top, md, -PL*S/2, top/2, md/2, MAT.wall);
  addBox(PL*S, top, md, tw+PL*S/2, top/2, md/2, MAT.wall);

  // pilastras internas
  for(let i=0;i<L.stalls.length-1;i++){
    const s=L.stalls[i];
    const d=Math.max(s.depth,L.stalls[i+1].depth)*S;
    addBox(PL*S, top, d, (s.x1*S)+PL*S/2, top/2, d/2, MAT.wall);
  }

  // por cabina: highlight, inodoro, puerta, número, zona clicable
  L.stalls.forEach(s=>{
    const x0=s.x0*S, x1=s.x1*S, d=s.depth*S, cx=(x0+x1)/2;

    if(s.index===state.selected){
      const hl=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0, d), MAT.hlFloor);
      hl.rotation.x=-Math.PI/2; hl.position.set(cx,0.02,d/2); root.add(hl);
    }

    addToilet3D(toiletCenter(s)*S, d, s);
    addDoor3D(s, gap, partH);
    addNumber3D(cx, top+9*S, 13*S, s.index+1, s.index===state.selected);

    // zona clicable (plano invisible sobre el suelo)
    const zone=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,d), new THREE.MeshBasicMaterial({visible:false}));
    zone.rotation.x=-Math.PI/2; zone.position.set(cx,0.01,d/2);
    zone.userData.stall=s.index; root.add(zone); pick3d.push(zone);
  });

  if(reframe || !framed){
    const cx=tw/2, cz=md/2;
    controls.target.set(cx, top*0.4, cz);
    camera.position.set(cx, Math.max(tw,md)*0.55+top, md + Math.max(tw,md)*0.75);
    framed=true;
  }
  resize3D();
}

function addBox(w,h,d,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); root.add(m); return m;
}

function addToilet3D(cx, depthFt, s){
  const g=new THREE.Group();
  const backZ = 3*S;
  // tanque
  const tank=new THREE.Mesh(new THREE.BoxGeometry(19*S,20*S,7*S),MAT.porc);
  tank.position.set(0,10*S,backZ+3.5*S);
  // base + taza
  const base=new THREE.Mesh(new THREE.CylinderGeometry(6*S,7*S,12*S,20),MAT.porc);
  base.position.set(0,6*S,backZ+16*S);
  const bowl=new THREE.Mesh(new THREE.CylinderGeometry(9*S,7*S,5*S,24),MAT.porc);
  bowl.position.set(0,14*S,backZ+16*S);
  g.add(tank,base,bowl);
  g.position.set(cx,0,0);
  root.add(g);
}

function addDoor3D(s, gap, partH){
  const c=s.cfg;
  const {start,end}=doorSpan(s);
  const openW=c.doorOpening*S, frontZ=s.depth*S;
  const left=c.doorSwing.includes('left');
  const inward=c.doorSwing.includes('in');
  const grp=new THREE.Group();
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(openW,partH,1.2*S),MAT.door);
  mesh.position.x = left? openW/2 : -openW/2;
  grp.add(mesh);
  const hingeX = (left? start:end)*S;
  grp.position.set(hingeX, gap+partH/2, frontZ);
  const th=THREE.MathUtils.degToRad(72);
  grp.rotation.y = left? (inward? th:-th) : (inward? -th: th);
  root.add(grp);
}

function addNumber3D(x,y,size,n,sel){
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const c=cv.getContext('2d');
  c.beginPath(); c.arc(64,64,58,0,Math.PI*2);
  c.fillStyle = sel? '#e23b3b':'#12263f'; c.fill();
  c.fillStyle='#fff'; c.font='bold 74px sans-serif';
  c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(n),64,70);
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));
  sp.scale.set(size,size,1); sp.position.set(x,y,3*S);
  root.add(sp);
}

function onPick3D(e){
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObjects(pick3d,false);
  if(hit.length) selectStall(hit[0].object.userData.stall);
}

function resize3D(){
  if(!renderer) return;
  const w=host.clientWidth, h=host.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}

function loop(){
  if(!running) return;
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* =========================================================
   UI: poblar controles, enlazar eventos
   ========================================================= */
function opt(v,l){ const o=document.createElement('option'); o.value=v; o.textContent=l; return o; }

function fillSelect(id, values, labelFn){
  const el=document.getElementById(id); el.innerHTML='';
  values.forEach(v=>{
    if(Array.isArray(v)) el.appendChild(opt(v[0],v[1]));
    else el.appendChild(opt(v, labelFn? labelFn(v): v+' inches'));
  });
}

fillSelect('partitionDepth', OPTS.partitionDepth);
fillSelect('stallWidth', OPTS.stallWidth);
fillSelect('stallWidthFrac', OPTS.frac);
fillSelect('doorOpening', OPTS.doorOpening);
fillSelect('doorSwing', OPTS.swing);
fillSelect('doorPosition', OPTS.position);
fillSelect('toiletPosition', OPTS.position);

const controlsMap = {
  partitionDepth:{k:'partitionDepth',num:true},
  stallWidth:{k:'stallWidth',num:true},
  stallWidthFrac:{k:'stallWidthFrac',num:true},
  doorOpening:{k:'doorOpening',num:true},
  doorSwing:{k:'doorSwing'},
  doorPosition:{k:'doorPosition'},
  toiletPosition:{k:'toiletPosition'}
};
Object.keys(controlsMap).forEach(id=>{
  document.getElementById(id).addEventListener('change',e=>{
    const {k,num}=controlsMap[id];
    state.stalls[state.selected][k] = num? parseFloat(e.target.value) : e.target.value;
    render();
  });
});

function refreshStallSelect(){
  const el=document.getElementById('stallSelect'); el.innerHTML='';
  state.stalls.forEach((_,i)=> el.appendChild(opt(i, `Stall ${i+1}`)));
  el.value=state.selected;
}
document.getElementById('stallSelect').addEventListener('change',e=>selectStall(+e.target.value));

function syncControls(){
  const c=state.stalls[state.selected];
  document.getElementById('partitionDepth').value=c.partitionDepth;
  document.getElementById('stallWidth').value=c.stallWidth;
  document.getElementById('stallWidthFrac').value=c.stallWidthFrac;
  document.getElementById('doorOpening').value=c.doorOpening;
  document.getElementById('doorSwing').value=c.doorSwing;
  document.getElementById('doorPosition').value=c.doorPosition;
  document.getElementById('toiletPosition').value=c.toiletPosition;
  document.getElementById('customizeLabel').textContent=`Customize Stall ${state.selected+1}`;
}

function selectStall(i){
  state.selected=Math.max(0,Math.min(state.stalls.length-1,i));
  document.getElementById('stallSelect').value=state.selected;
  syncControls();
  render();
}

/* Contador de cabinas */
document.getElementById('stallPlus').addEventListener('click',()=>{
  if(state.stalls.length>=10) return;
  state.stalls.push(defaultStall());
  document.getElementById('stallCount').textContent=state.stalls.length;
  refreshStallSelect();
  build3D(true);
  render();
});
document.getElementById('stallMinus').addEventListener('click',()=>{
  if(state.stalls.length<=1) return;
  state.stalls.pop();
  if(state.selected>=state.stalls.length) state.selected=state.stalls.length-1;
  document.getElementById('stallCount').textContent=state.stalls.length;
  refreshStallSelect();
  selectStall(state.selected);
  build3D(true);
});

/* Room name */
document.getElementById('roomName').addEventListener('input',e=>{ state.roomName=e.target.value; });

/* Toggle 2D / 3D */
const btn2d=document.getElementById('btn2d'), btn3d=document.getElementById('btn3d');
btn2d.addEventListener('click',()=>setView('2d'));
btn3d.addEventListener('click',()=>setView('3d'));

function setView(v){
  state.view=v;
  btn2d.classList.toggle('active',v==='2d');
  btn3d.classList.toggle('active',v==='3d');
  document.getElementById('view2d').style.display = v==='2d'?'block':'none';
  document.getElementById('view3d').style.display = v==='3d'?'block':'none';
  if(v==='3d'){
    build3D(false);
    running=true; resize3D(); loop();
  }else{
    running=false;
    draw2D();
  }
}

/* Render maestro según vista activa */
function render(){
  if(state.view==='2d') draw2D();
  else build3D(false);
}

/* Resize */
const ro=new ResizeObserver(()=>{ if(state.view==='2d') draw2D(); else resize3D(); });
ro.observe(document.getElementById('canvasWrap'));
window.addEventListener('resize',()=>{ if(state.view==='2d') draw2D(); else resize3D(); });

/* =========================================================
   ARRANQUE
   ========================================================= */
refreshStallSelect();
syncControls();
draw2D();
</script>
</body>
</html>
