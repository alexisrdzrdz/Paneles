services:
  db:
    image: postgres:17-alpine
    container_name: mauricios-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mauricios
      POSTGRES_PASSWORD: mauricios_dev
      POSTGRES_DB: mauricios
    ports:
      - "5433:5432"          # 5433 en el host para no chocar con un Postgres local
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mauricios -d mauricios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
